name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Build the APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        shell: bash
        run: |
          LINE=$(grep -n "# Command failed" build.log | head -1 | cut -d: -f1)
          echo "===== LAST LINES BEFORE THE FAILURE ====="
          if [ -n "$LINE" ]; then
            START=$((LINE-80)); [ "$START" -lt 1 ] && START=1
            sed -n "${START},${LINE}p" build.log | sed 's/\x1b\[[0-9;]*m//g'
          else
            tail -80 build.log | sed 's/\x1b\[[0-9;]*m//g'
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: SongDetector-apk
          path: bin/*.apk
